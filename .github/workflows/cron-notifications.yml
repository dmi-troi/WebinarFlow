name: Cron Notifications

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger notification cron
        run: |
          RESPONSE=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" \
            -X GET "${{ secrets.RENDER_SERVICE_URL }}/api/notifications/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Accept: application/json")
          
          echo "HTTP Status: $RESPONSE"
          cat /tmp/cron_response.json
          
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Cron failed with status $RESPONSE"
            exit 1
          fi
          
          echo "Cron triggered successfully"
