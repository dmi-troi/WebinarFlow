name: WebinarFlow validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.github-actions-validation.db
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Prisma validate
        run: npx prisma validate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
